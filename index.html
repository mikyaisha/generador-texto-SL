<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SL Profile Editor - Multi Styles</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            color: #ff003c;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255, 0, 60, 0.5);
            text-align: center;
        }
        h2 {
            color: #ff003c;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.2rem;
            margin-bottom: 5px;
            text-align: center;
        }
        p {
            color: #888;
            margin-bottom: 10px;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: space-between;
        }
        .style-btn {
            flex: 1;
            background-color: #222;
            color: #aaa;
            border: 1px solid #444;
            padding: 10px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        .style-btn:hover {
            background-color: #333;
            color: #fff;
        }
        .style-btn.active {
            background-color: #ff003c;
            color: white;
            border-color: #ff003c;
            font-weight: bold;
            box-shadow: 0 0 8px rgba(255, 0, 60, 0.4);
        }
        /* Shared styles for textareas and inputs */
        textarea, .sl-input {
            width: 100%;
            background-color: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        textarea {
            height: 100px;
            resize: none;
        }
        textarea:focus, .sl-input:focus {
            border-color: #ff003c;
        }
        .copy-btn {
            background-color: #ff003c;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .copy-btn:hover {
            background-color: #cc0030;
        }
        .output-link {
            background-color: #111;
            color: #ff003c;
            border: 1px dashed #ff003c;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Create your personalized profile</h1>
    <p>Write it once, choose your text and copy it to SL.</p>
    <p style="margin-bottom: 30px;">This is a free-to-use website; I will accept any donation to my Second Life profile MikyAisha Resident.</p>

    <div class="container">
        <div class="button-group">
            <button class="style-btn active" id="btn-smallcaps" onclick="setStyle('smallcaps')">Sᴍᴀʟʟ Cᴀᴘs</button>
            <button class="style-btn" id="btn-doublestruck" onclick="setStyle('doublestruck')">𝔻𝕠𝕦𝕓𝕝𝕖 𝕊𝕥𝕣𝕦𝕔𝕜</button>
            <button class="style-btn" id="btn-gothic" onclick="setStyle('gothic')">𝕲𝖔𝖙𝖍𝖎𝖈</button>
        </div>

        <textarea id="inputText" placeholder="Type your normal text here... (Ex: Pay the toll)"></textarea>
        
        <textarea id="outputText" readonly placeholder="Yᴏᴜʀ ʀᴇᴀᴅʏ ᴛᴇxᴛ ᴡɪʟʟ ᴀᴘᴘᴇᴀʀ ʜᴇʀᴇ..."></textarea>
        
        <button class="copy-btn" onclick="copyToClipboard()" id="copyBtn">Copy to Clipboard 📋</button>
    </div>

    <div class="container">
        <h2>SL Link Generator 🔗</h2>
        
        <input type="text" id="linkUrl" class="sl-input" placeholder="Paste the URL here (Ex: secondlife:///app/... or https://...)">
        
        <input type="text" id="linkText" class="sl-input" placeholder="Text to display (Ex: Thank you for your donation)">
        
        <input type="text" id="linkOutput" class="sl-input output-link" readonly placeholder="[The formatted link will appear here]">
        
        <button class="copy-btn" onclick="copyLink()" id="copyLinkBtn">Copy Link 🔗</button>
    </div>

    <script>
        // --- TEXT CONVERTER LOGIC ---
        const fonts = {
            smallcaps: {
                'a':'ᴀ','b':'ʙ','c':'ᴄ','d':'ᴅ','e':'ᴇ','f':'ғ','g':'ɢ','h':'ʜ','i':'ɪ','j':'ᴊ','k':'ᴋ','l':'ʟ','m':'ᴍ','n':'ɴ','o':'ᴏ','p':'ᴘ','q':'ǫ','r':'ʀ','s':'s','t':'ᴛ','u':'ᴜ','v':'ᴠ','w':'ᴡ','x':'x','y':'ʏ','z':'ᴢ',
                'A':'ᴀ','B':'ʙ','C':'ᴄ','D':'ᴅ','E':'ᴇ','F':'ғ','G':'ɢ','H':'ʜ','I':'ɪ','J':'ᴊ','K':'ᴋ','L':'ʟ','M':'ᴍ','N':'ɴ','O':'ᴏ','P':'ᴘ','Q':'ǫ','R':'ʀ','S':'s','T':'ᴛ','U':'ᴜ','V':'ᴠ','W':'ᴡ','X':'x','Y':'ʏ','Z':'ᴢ'
            },
            doublestruck: {
                'a':'𝕒','b':'𝕓','c':'𝕔','d':'𝕕','e':'𝕖','f':'𝕗','g':'𝕘','h':'𝕙','i':'𝕚','j':'𝕛','k':'𝕜','l':'𝕝','m':'𝕞','n':'𝕟','o':'𝕠','p':'𝕡','q':'𝕢','r':'𝕣','s':'𝕤','t':'𝕥','u':'𝕦','v':'𝕧','w':'𝕨','x':'𝕩','y':'𝕪','z':'𝕫',
                'A':'𝔸','B':'𝔹','C':'ℂ','D':'𝔻','E':'𝔼','F':'𝔽','G':'𝔾','H':'ℍ','I':'𝕀','J':'𝕁','K':'𝕂','L':'𝕃','M':'𝕄','N':'ℕ','O':'𝕆','P':'ℙ','Q':'ℚ','R':'ℝ','S':'𝕊','T':'𝕋','U':'𝕌','V':'𝕍','W':'𝕎','X':'𝕏','Y':'𝕐','Z':'ℤ',
                '0':'𝟘','1':'𝟙','2':'𝟚','3':'𝟛','4':'𝟜','5':'𝟝','6':'𝟞','7':'𝟟','8':'𝟠','9':'𝟡'
            },
            gothic: {
                'a':'𝖆','b':'𝖇','c':'𝖈','d':'𝖉','e':'𝖊','f':'𝖋','g':'𝖌','h':'𝖍','i':'𝖎','j':'𝖏','k':'𝖐','l':'𝖑','m':'𝖒','n':'𝖓','o':'𝖔','p':'𝖕','q':'𝖖','r':'𝖗','s':'𝖘','t':'𝖙','u':'𝖚','v':'𝖛','w':'𝖜','x':'𝖝','y':'𝖞','z':'𝖟',
                'A':'𝕬','B':'𝕭','C':'𝕮','D':'𝕯','E':'𝕰','F':'𝕱','G':'𝕲','H':'𝕳','I':'𝕴','J':'𝕵','K':'𝕶','L':'𝕷','M':'𝕸','N':'𝕹','O':'𝕺','P':'𝕻','Q':'𝕼','R':'𝕽','S':'𝕾','T':'𝕿','U':'𝖀','V':'𝖁','W':'𝖂','X':'𝖃','Y':'𝖄','Z':'𝖅'
            }
        };

        let currentStyle = 'smallcaps';
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const copyBtn = document.getElementById('copyBtn');

        function setStyle(styleName) {
            currentStyle = styleName;
            document.querySelectorAll('.style-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + styleName).classList.add('active');
            convertText();
        }

        function convertText() {
            let result = '';
            let map = fonts[currentStyle];
            let val = inputText.value;
            for (let i = 0; i < val.length; i++) {
                let char = val[i];
                result += map[char] || char; 
            }
            outputText.value = result;
            resetCopyButton();
        }

        inputText.addEventListener('input', convertText);

        function copyToClipboard() {
            if (!outputText.value) return;
            outputText.select();
            document.execCommand('copy');
            copyBtn.textContent = "Copied! ✔️";
            copyBtn.style.backgroundColor = "#4CAF50"; 
            window.getSelection().removeAllRanges();
        }

        function resetCopyButton() {
            copyBtn.textContent = "Copy to Clipboard 📋";
            copyBtn.style.backgroundColor = "#ff003c";
        }

        // --- LINK GENERATOR LOGIC ---
        const linkUrl = document.getElementById('linkUrl');
        const linkText = document.getElementById('linkText');
        const linkOutput = document.getElementById('linkOutput');
        const copyLinkBtn = document.getElementById('copyLinkBtn');

        function updateLink() {
            let url = linkUrl.value.trim();
            let text = linkText.value.trim();
            
            if (url !== "" || text !== "") {
                linkOutput.value = `[${url} ${text}]`;
            } else {
                linkOutput.value = "";
            }
            resetLinkButton();
        }

        linkUrl.addEventListener('input', updateLink);
        linkText.addEventListener('input', updateLink);

        function copyLink() {
            if (!linkOutput.value) return;
            linkOutput.select();
            document.execCommand('copy');
            copyLinkBtn.textContent = "Link Copied! ✔️";
            copyLinkBtn.style.backgroundColor = "#4CAF50"; 
            window.getSelection().removeAllRanges();
        }

        function resetLinkButton() {
            copyLinkBtn.textContent = "Copy Link 🔗";
            copyLinkBtn.style.backgroundColor = "#ff003c";
        }
    </script>

    <br>

        <img style="border: 0px solid; display: inline;" alt="visit counter" src="https://websmultimedia.com/contador-de-visitas.php?id=24473"></a><br><a style="color: #666; font-size: 14px; text-decoration: none;">Thank you for your donation L$</a></center>
    </body>
</html>
